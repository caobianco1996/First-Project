<label for="server-name">Server Name</label>
<input
  id="server-name"
  type="text"
  class="form-control"
  [(ngModel)]="serverName"
  (keyup.enter)="onCreateServer()">

<button
  class="btn btn-primary"
  [disabled]="!allowNewServer || !serverName.trim()"
  (click)="onCreateServer()">
  Add Server
</button>

<p *ngIf="lastCreatedServer" role="status">
  Server was created: {{ lastCreatedServer }}
</p>

<app-server *ngFor="let server of servers" [serverName]="server"></app-server>
